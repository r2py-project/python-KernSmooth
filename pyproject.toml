[build-system]
build-backend = "mesonpy"
requires = ["meson-python", "meson", "ninja", "numpy"]

[project]
name = "r2py_kernsmooth"
version = "0.1.1"
description = "Python port of the R package KernSmooth: binned kernel density estimation, local polynomial regression, and plug-in bandwidth selection."
readme = "README.md"
license = "LicenseRef-Unlimited"
license-files = ["LICENSE", "NOTICE", "LICENCE.note"]
authors = [
    { name = "Yufei Cai", email = "ycai9@nd.edu" },
    { name = "Jun Li", email = "jun.li@nd.edu" },
]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/r2py-project/r2py_kernsmooth"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# 32-bit Windows is skipped: the MSYS2 MINGW64 toolchain is x86_64-only.
skip = ["*-manylinux_i686", "*-win32"]
build-frontend = "build"

[tool.cibuildwheel.linux]
before-all = "command -v dnf && dnf install -y openblas-devel || command -v yum && yum install -y openblas-devel || apk add --no-cache gfortran openblas-dev"

[tool.cibuildwheel.macos]
before-all = "brew install openblas"

[tool.cibuildwheel.macos.environment]
PKG_CONFIG_PATH = "$(brew --prefix openblas)/lib/pkgconfig"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
# PATH/PKG_CONFIG_PATH for the MinGW toolchain are set by the workflow, which is
# the only place the MSYS2 install location is known.